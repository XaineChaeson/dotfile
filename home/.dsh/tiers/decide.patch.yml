# Decide tier (owner, 2026-11-08): dsh --profile headless --patch ~/.dsh/tiers/decide.patch.yml
# Design, analysis, diagnosis and review. More effort is not more ability: a piece that keeps failing review here
# moves to another executor's decide tier, not to a higher effort on this one.
# The only place that sets this tier's model and effort; list models with GET https://api.deepseek.com/models.
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-flash
    reasoningEffort: high
