# Portable personal defaults only.
# Keep project trust, credentials, marketplace/cache state, plugin installation,
# machine-specific MCP commands, UI state, and experimental feature choices local.

model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"
personality = "pragmatic"

[features]
multi_agent = true
shell_snapshot = true

[agents]
enabled = true
max_concurrent_threads_per_session = 4
